<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>carousel test</title>
  <style>
    body { margin: 0; background: #f5f5f5; font-family: sans-serif; }
    #yh-carousel { margin: 16px; background: #ddd; }
    #log { padding: 12px; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="yh-carousel" class="hero-slides"></div>
  <div id="log"></div>
  <script>
    const log = (m) => { document.getElementById('log').textContent += m + '\\n'; console.log(m); };
  </script>
  <script>
(function(){
  if (window.__yhCarouselBooted) return;
  window.__yhCarouselBooted = true;
  var imgs = [], idx = 0, timer = null, root = null;
  function ensureRoot(){
    root = document.getElementById('yh-carousel') || document.querySelector('.hero-slides');
    return root;
  }
  function paint(){
    if (!ensureRoot() || !imgs.length) return;
    var url = imgs[idx];
    var dots = '';
    for (var i=0;i<imgs.length;i++){
      dots += '<span data-yh-i="'+i+'" style="width:8px;height:8px;border-radius:50%;display:inline-block;margin:0 4px;cursor:pointer;background:'+(i===idx?'#fff':'rgba(255,255,255,.45)')+';"></span>';
    }
    root.setAttribute('data-yh','1');
    root.style.cssText = 'position:relative;overflow:hidden;border-radius:16px;min-height:140px;';
    root.innerHTML = ''
      + '<img alt="banner" src="'+url+'" style="display:block;width:100%;height:auto;border-radius:16px;"/>'
      + '<div style="position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;">'+dots+'</div>';
    log('paint idx='+idx+' src='+url);
    var list = root.querySelectorAll('[data-yh-i]');
    for (var j=0;j<list.length;j++){
      list[j].onclick = (function(n){ return function(ev){ ev.stopPropagation(); idx=n; paint(); arm(); }; })(+list[j].getAttribute('data-yh-i'));
    }
  }
  function arm(){
    if (timer) clearInterval(timer);
    if (imgs.length > 1) timer = setInterval(function(){ idx = (idx+1)%imgs.length; paint(); }, 2500);
  }
  function normalize(u){
    if (!u) return '';
    u = String(u);
    if (u.indexOf('http') === 0) return u;
    if (u.charAt(0) !== '/') u = '/' + u;
    return 'https://api.yh377.shop' + u;
  }
  function load(){
    fetch('/api/index/api/getSlides').then(function(r){return r.json()}).then(function(res){
      var list = (res && res.data) || [];
      var next = [];
      for (var i=0;i<list.length;i++){
        var u = normalize(list[i].img || list[i].value || '');
        if (u) next.push(u);
      }
      log('loaded '+next.length+' slides');
      imgs = next; idx = 0; paint(); arm();
    }).catch(function(e){ log('load fail '+e); });
  }
  load();
})();
  </script>
</body>
</html>
